# configuration for parallel string method simulations

######################################################

# job id (increment from 0!)
set job_id 0

# number of iterations
set runs 10000
# when restarting, note that the number of previous runs will be determined from the *restart.xsc files

# number of copies per image
set nc 1
# number of replicas must be a multiple of nc
# number of images is determined by the number of replicas divided by number of copies

# number of samples per replica; default: 1 
set ns 10
# number of samples generated per replica at every iteration
# ns can replace nc if there are not enough processors available
# ns and nc can also be combined for maximum efficiency
# each image update uses nc x ns observations without increasing the number of replicas

# simulation time for equilibration stage (restraining)
set runE 20000

# simulation time for drifting stage (releasing)
set runR 200

set numStages 20

# colvars config file (must have a harmonic block; the centers and force constant of this block are overriden by the info provided below)
set colvars_conf colvars.conf

# harmonic block used (must be defined in colvars)
set harm "harm"

# force constatnt for the restraining stage
#set force 0.001
set force 2

# all collective variables used (they all have to be in one harmonic block)
set cvs { phi psi }

# dimension of collective variables
set cvsd { 0 0 } 
#set cvsd 4
# note: if only one number provided all cvs will have that dimension

# metric used for the distance calculations (each number provides a weight for each cv)
set cvsm { 1 1 }
#set cvsm 1
# note: if only one number provided all cvs will have that weight

# randomized update (if 1, it will update the images in a randomized fashion otherwise in deterministically)
set randomized_update 0

# fixed endpoints (if 1, fix the endpoints according the very initial ones, otherwise let them move)
set fixed_ends 1

# initial reparametrization (if 1, it will reparametrize/smoothen at the beginning, otherwise will use the average)
set initial_reparam 1

# smoothing parameter (fix the end points, but smooth the middles according eq.7 JPCB 2025) 
set smooth 0.2
# 0.2
# ranges between 0 and smaller than 1; safe starts 0.05-0.2 (0 skips smoothing)
# if the smooth is too large, the path can shrink and over-smooth
# 1/(Node-1); 1 causes instability
#
set mins 0; # to minimize and reinitvels 

# We now update swarms as (X_new=(1-c)X_old+cX_swarm, where c=update_fraction=1 falls back to what we had before)
set update_fraction 0.2
# To update cvsm on-the-fly: (currently disabled)
set adaptive_cvsm 0
#set cvsm_relaxation 0.2
#set cvsm_min 0.0001; # bounded values for cvsm
#set cvsm_max 0.01

######################################################
# set the output directories here:
set output_root "output/%s/alad"
######################################################
set input_root "../2.prep/alad_%02d" ; # initial conformations (comment out if no *.coor is available)
set usevel 1 ; #do you have *.vel files? (if 1; input_root must be set as well)
set usexsc 0 ; #do you have *.xsc files? (if 1; input_root must be set as well)
set zerotime 1 ; #do you want to zero firsttimestep (doesn't matter if usexsc is not set to 1)
set cellinfo { {24 0 0} {0 24 0} {0 0 24} {0 0 0} }
# cellBasicVectors 1 to 3 and cellOrigin (not needed if usexsc is set to 1)
######################################################
set system_conf alad.namd
# this is your usual namd config file without the following commands:
# outputname, bincoordinates, binvelocities, extendedsystem, firsttimestep, and run as well as colvarsInput

######################################################
# generic configuration file for string method with swarms of trajectories:
source smwst.namd
#source smwst.namd.Reparam_on_smooth
